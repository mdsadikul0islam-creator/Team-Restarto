name: Update videos from YouTube

on:
  schedule:
    - cron: '5 5,6,7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add new videos to index.html
        run: |
          cat > update-videos.mjs <<'SCRIPT_END'
          import fs from 'node:fs';

          const FILE = process.env.TARGET || 'index.html';
          const HANDLE = process.env.YT_HANDLE || 'teamrestarto1';
          const KNOWN_ID = 'UCDwgn4MWDeBTVenD2371Fnw';
          const UA = {
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            'accept-language': 'en-US,en;q=0.9',
            'cookie': 'CONSENT=YES+1; SOCS=CAI',
          };

          async function getText(url, extra = {}) {
            const r = await fetch(url, { headers: { ...UA, ...extra } });
            if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
            return r.text();
          }

          function decode(s) {
            return s
              .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(+n))
              .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
              .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'").replace(/&amp;/g, '&');
          }

          /* ---------- source 1 and 2: RSS feeds ---------- */
          function parseFeed(xml) {
            return [...xml.matchAll(/<entry>([\s\S]*?)<\/entry>/g)].map(e => ({
              id: (e[1].match(/<yt:videoId>([\w-]{11})<\/yt:videoId>/) || [])[1],
              title: decode(((e[1].match(/<title>([\s\S]*?)<\/title>/) || [])[1] || '').trim()),
            })).filter(e => e.id);
          }

          async function fromFeeds() {
            const urls = [
              'https://www.youtube.com/feeds/videos.xml?channel_id=' + KNOWN_ID,
              'https://www.youtube.com/feeds/videos.xml?playlist_id=UU' + KNOWN_ID.slice(2),
            ];
            for (const u of urls) {
              try {
                const list = parseFeed(await getText(u, { accept: 'application/atom+xml,application/xml,text/xml,*/*' }));
                console.log('Feed OK:', u, '->', list.length, 'videos');
                if (list.length) return [{ name: 'feed', short: null, entries: list }];
              } catch (e) { console.log('Feed failed:', e.message); }
            }
            return null;
          }

          /* ---------- source 3: channel pages ---------- */
          function walk(node, out) {
            if (!node || typeof node !== 'object') return;
            if (Array.isArray(node)) { for (const x of node) walk(x, out); return; }
            if (node.videoRenderer && node.videoRenderer.videoId) {
              const v = node.videoRenderer;
              const t = v.title && (v.title.runs ? v.title.runs.map(r => r.text).join('') : v.title.simpleText);
              out.push({ id: v.videoId, title: t || '' });
            }
            const s = node.shortsLockupViewModel;
            if (s) {
              const id = (((s.onTap || {}).innertubeCommand || {}).reelWatchEndpoint || {}).videoId ||
                         (s.entityId || '').replace(/^shorts-shelf-item-/, '');
              const t = (((s.overlayMetadata || {}).primaryText || {}).content) || '';
              if (/^[\w-]{11}$/.test(id || '')) out.push({ id, title: t });
            }
            for (const k of Object.keys(node)) walk(node[k], out);
          }

          async function fromTab(tab, short) {
            const html = await getText('https://www.youtube.com/@' + HANDLE + '/' + tab);
            const m = html.match(/ytInitialData\s*=\s*(\{[\s\S]*?\});\s*<\/script>/);
            if (!m) throw new Error('ytInitialData not found on /' + tab);
            const out = [];
            walk(JSON.parse(m[1]), out);
            const seen = new Set();
            const entries = out.filter(e => !seen.has(e.id) && seen.add(e.id));
            console.log('Page /' + tab + ':', entries.length, 'videos');
            return { name: tab, short, entries };
          }

          async function fromPages() {
            const res = [];
            for (const [tab, short] of [['shorts', true], ['videos', false]]) {
              try { const r = await fromTab(tab, short); if (r.entries.length) res.push(r); }
              catch (e) { console.log('Page failed:', tab, '-', e.message); }
            }
            return res.length ? res : null;
          }

          /* ---------- helpers ---------- */
          // Remove #hashtags from a title. If nothing is left, keep the words without the # sign.
          function cleanTitle(t) {
            const tidy = x => x.replace(/\s+/g, ' ').trim();
            const stripped = tidy(t.replace(/(^|\s)#[^\s#]+/gu, (all, sp) => /^\s*#\d+$/.test(all) ? all : ' '));
            return stripped || tidy(t.replace(/#/g, ''));
          }

          async function isShort(id) {
            try {
              const r = await fetch('https://www.youtube.com/shorts/' + id, { headers: UA, redirect: 'manual' });
              return r.status === 200;
            } catch { return true; }
          }

          async function thumb(id, short) {
            const name = short ? 'hqdefault' : 'mqdefault';
            const r = await fetch('https://i.ytimg.com/vi/' + id + '/' + name + '.jpg', { headers: UA });
            if (!r.ok) return '';
            return 'data:image/jpeg;base64,' + Buffer.from(await r.arrayBuffer()).toString('base64');
          }

          /* ---------- main ---------- */
          const html = fs.readFileSync(FILE, 'utf8');
          const re = /(<script id="vdata" type="application\/json">)([\s\S]*?)(<\/script>)/;
          const m = html.match(re);
          if (!m) throw new Error('vdata block not found in ' + FILE);
          const list = JSON.parse(m[2]);
          const known = new Set(list.map(v => v.id));
          console.log('Page has', list.length, 'videos');

          const sources = (await fromFeeds()) || (await fromPages());
          if (!sources) throw new Error('Could not read any video list from YouTube (see the lines above).');

          // Only videos newer than the newest known video are added,
          // so videos deleted in the admin panel do not come back.
          const fresh = [];
          for (const src of sources) {
            let part;
            if (!list.length) part = src.entries;
            else {
              const idx = src.entries.findIndex(e => known.has(e.id));
              if (idx < 0) { console.log('Source', src.name, ': no known video in it, skipped.'); continue; }
              part = src.entries.slice(0, idx);
            }
            for (const e of part) if (!known.has(e.id) && !fresh.some(f => f.e.id === e.id)) fresh.push({ e, short: src.short });
          }
          if (!fresh.length) { console.log('No new videos.'); process.exit(0); }

          const add = [];
          for (const { e, short: s } of fresh) {
            const short = s === null ? await isShort(e.id) : s;
            let img = '';
            try { img = await thumb(e.id, short); } catch {}
            add.push({ id: e.id, title: cleanTitle(e.title || '') || 'Untitled', short, img });
            console.log('Added:', e.id, cleanTitle(e.title || ''));
          }
          const json = JSON.stringify(add.concat(list)).replace(/</g, '\\u003c');
          fs.writeFileSync(FILE, html.replace(re, (_, a, __, c) => a + json + c));
          SCRIPT_END
          node update-videos.mjs
          rm update-videos.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Auto-add new videos from YouTube"
            git push
          fi
